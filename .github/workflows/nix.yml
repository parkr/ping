name: Nix
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Refresh vendorHash on dependency PRs
      if: ${{ startsWith(github.head_ref, 'dependabot/go_modules/') && matrix.os == 'ubuntu-latest' }}
      run: |
        script/update-vendor-hash || true
        if ! git diff --quiet nix/package.nix; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "nix: update vendorHash"
          git push
        fi
    - run: nix build .#ping --print-build-logs
    - run: nix run .#ping -- -h
    - run: nix flake check
