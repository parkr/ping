name: Nix
on:
  pull_request:
jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.head_ref }}
    - uses: DeterminateSystems/nix-installer-action@main
    - name: Refresh vendorHash on the PR branch
      if: ${{ matrix.os == 'ubuntu-latest' && github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        script/update-vendor-hash || true
        if ! git diff --quiet nix/package.nix; then
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "nix: update vendorHash" nix/package.nix
          git push origin "HEAD:${{ github.head_ref }}"
        fi
    - run: nix build .#ping --print-build-logs
    - run: nix run .#ping -- -h
    - run: nix flake check
